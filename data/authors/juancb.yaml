bio: |
  I research and develop AI-based systems to tackle complex problems in quantum
  computing and other relevant areas.

  My work sits at the intersection of quantum computing, machine learning, and
  open source. I hold IBM Master Inventor status and have contributed to tools
  used by millions of developers worldwide.

  I have a PhD in Computer Engineering from the University of Salamanca (2018),
  have authored 80+ publications, and received the 2019 SCIE-BBVA Award for best
  young researcher in Computer Science in Spain.

